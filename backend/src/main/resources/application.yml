spring:
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: codingx-backend
  sql:
    init:
      # 显式启用 SQL 初始化，确保 PostgreSQL 环境也会执行 schema/init 脚本
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/init.sql
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codingx}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:5001}

sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-log: false
  token-style: uuid
  auto-renew: true
  allow-simple-header: true
  token-sign-key: ${SA_TOKEN_SIGN_KEY:${SATOKEN_SIGN_KEY:replace-me}}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 关闭 MyBatis 控制台 SQL/会话调试输出，避免污染后端运行日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    # 屏蔽 MyBatis / MyBatis-Spring 的调试级会话日志
    org.apache.ibatis: WARN
    org.mybatis.spring: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5002,http://localhost:5003}
  ai:
    provider: ${AI_PROVIDER:bailian}
    base-url: ${AI_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}}
    api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
    chat-model: ${AI_CHAT_MODEL:${DEEPSEEK_CHAT_MODEL:deepseek-chat}}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:120000}
    system-prompt: ${AI_SYSTEM_PROMPT:You are the CodingX assistant. Be concise, practical, and safe.}
    selection:
      failure-threshold: ${AI_FAILURE_THRESHOLD:2}
      open-duration-ms: ${AI_OPEN_DURATION_MS:30000}
      first-packet-timeout-ms: ${AI_FIRST_PACKET_TIMEOUT_MS:60000}
    providers:
      bailian:
        base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com}
        api-key: ${BAILIAN_API_KEY:}
        endpoints:
          chat: /compatible-mode/v1/chat/completions
      siliconflow:
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
        api-key: ${SILICONFLOW_API_KEY:}
        endpoints:
          chat: /v1/chat/completions
      deepseek:
        base-url: ${AI_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}}
        api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
      stub:
        base-url: stub://local
        api-key: ""
    chat:
      default-model: ${AI_DEFAULT_MODEL:qwen-plus}
      deep-thinking-model: ${AI_DEEP_THINKING_MODEL:qwen3-max}
      candidates:
        - id: qwen-plus
          provider: bailian
          model: ${BAILIAN_CHAT_MODEL:qwen-plus-latest}
          priority: 1
          enabled: true
          supports-thinking: false
        - id: qwen3-max
          provider: bailian
          model: ${BAILIAN_DEEP_MODEL:qwen3-max}
          priority: 2
          enabled: true
          supports-thinking: true
        - id: glm-4.7
          provider: siliconflow
          model: ${SILICONFLOW_CHAT_MODEL:Pro/zai-org/GLM-4.7}
          priority: 3
          enabled: true
          supports-thinking: true
        - id: stub-chat
          provider: stub
          model: stub-chat
          priority: 999
          enabled: true
          supports-thinking: true
  runtime:
    mock-step-delay-ms: ${MOCK_STEP_DELAY_MS:300}
    mock-fail-keyword: ${MOCK_FAIL_KEYWORD:fail}
    # 聊天并发门控配置：默认关闭 Redis 队列门控，按单机门控运行。
    use-redis-queue-gate: ${APP_RUNTIME_USE_REDIS_QUEUE_GATE:false}
    # 全局最大并发，超出后进入队列等待。
    queue-max-concurrent: ${APP_RUNTIME_QUEUE_MAX_CONCURRENT:2}
    # 排队最长等待时间，超时后返回 busy。
    queue-acquire-timeout-ms: ${APP_RUNTIME_QUEUE_ACQUIRE_TIMEOUT_MS:3000}
    # 排队轮询基础间隔，结合通知唤醒减少额外空转。
    queue-poll-interval-ms: ${APP_RUNTIME_QUEUE_POLL_INTERVAL_MS:200}
    # 执行资格租约时长，避免异常退出造成永久占位。
    queue-lease-seconds: ${APP_RUNTIME_QUEUE_LEASE_SECONDS:300}
    # 活跃会话续租间隔，必须小于租约时长。
    queue-lease-renew-interval-ms: ${APP_RUNTIME_QUEUE_LEASE_RENEW_INTERVAL_MS:10000}
  chat:
    memory:
      summary-enabled: ${CHAT_MEMORY_SUMMARY_ENABLED:true}
      summary-trigger-messages: ${CHAT_MEMORY_SUMMARY_TRIGGER_MESSAGES:12}
      history-keep-turns: ${CHAT_MEMORY_HISTORY_KEEP_TURNS:6}
      summary-max-characters: ${CHAT_MEMORY_SUMMARY_MAX_CHARACTERS:4000}

rustfs:
  endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
  access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
  secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
  region: ${RUSTFS_REGION:us-east-1}
  bucket: ${RUSTFS_BUCKET:codingx-skills}
  skill-prefix: ${RUSTFS_SKILL_PREFIX:chat-skills/packages}
