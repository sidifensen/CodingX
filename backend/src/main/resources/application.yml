spring:
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties] # 导入外部配置文件，支持 .env 属性文件
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:128MB} # Servlet 层单文件上传硬上限，避免默认 1MB 提前拦截
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:130MB} # Servlet 层单请求上传硬上限，需覆盖 multipart 边界开销
  application:
    name: codingx-backend # 应用名称
  sql:
    init:
      # 默认关闭启动期 SQL 初始化，避免每次启动重复执行 schema/init 脚本。
      # 如需一次性初始化可显式传入环境变量 SPRING_SQL_INIT_MODE=always。
      mode: ${SPRING_SQL_INIT_MODE:never} # SQL 初始化模式，默认 never 禁用
      schema-locations: classpath:db/schema.sql # 数据库 schema 脚本路径
      data-locations: classpath:db/init.sql # 数据库初始化数据脚本路径
  datasource:
    driver-class-name: org.postgresql.Driver # PostgreSQL JDBC 驱动类名
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codingx} # 数据库连接 URL，支持环境变量覆盖
    username: ${DB_USERNAME:postgres} # 数据库用户名，支持环境变量覆盖
    password: ${DB_PASSWORD:postgres} # 数据库密码，支持环境变量覆盖
  data:
    redis:
      host: ${REDIS_HOST:localhost} # Redis 主机地址，支持环境变量覆盖
      port: ${REDIS_PORT:6379} # Redis 端口号，支持环境变量覆盖
      password: ${REDIS_PASSWORD:} # Redis 密码，默认为空，支持环境变量覆盖
      database: ${REDIS_DATABASE:0} # Redis 数据库编号，支持环境变量覆盖
      timeout: 10s # Redis 连接超时时间
  jackson:
    time-zone: Asia/Shanghai # JSON 序列化时区
    date-format: yyyy-MM-dd HH:mm:ss # JSON 日期格式
    serialization:
      write-dates-as-timestamps: false # 日期是否序列化为时间戳，false 使用格式化字符串

rustfs:
  endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000} # RustFS 服务端点地址
  access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin} # RustFS 访问密钥
  secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin} # RustFS 秘密密钥
  region: ${RUSTFS_REGION:us-east-1} # RustFS 区域
  bucket: ${RUSTFS_BUCKET:codingx-skills} # RustFS 存储桶名称
  skill-prefix: ${RUSTFS_SKILL_PREFIX:chat-skills/packages} # 技能文件前缀路径
  attachment-prefix: ${RUSTFS_ATTACHMENT_PREFIX:chat/attachments} # 附件文件前缀路径

server:
  port: ${SERVER_PORT:5001} # 服务端口号，支持环境变量覆盖

sa-token:
  token-name: satoken # Token 参数名称
  timeout: 86400 # Token 有效期（秒），默认 24 小时
  active-timeout: -1 # 活跃超时时间，-1 表示不限制
  is-concurrent: true # 是否允许并发，true 表示同一账号可多处登录
  is-share: false # Token 是否共享，false 表示不共享
  is-log: false # 是否打印操作日志
  token-style: uuid # Token 样式，uuid 表示使用 UUID 格式
  auto-renew: true # 是否自动续签
  allow-simple-header: true # 是否允许简单Header传递Token
  token-sign-key: ${SA_TOKEN_SIGN_KEY:replace-me} # Token 签名密钥，优先由宿主环境注入

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 是否开启下划线转驼峰映射
    cache-enabled: false # 是否开启二级缓存
    # 关闭 MyBatis 控制台 SQL/会话调试输出，避免污染后端运行日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl # MyBatis 日志实现类
  global-config:
    db-config:
      id-type: input # 主键 ID 类型，input 表示手动输入
      logic-delete-field: deleted # 逻辑删除字段名
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值

logging:
  level:
    # 屏蔽 MyBatis / MyBatis-Spring 的调试级会话日志
    org.apache.ibatis: WARN # MyBatis 日志级别
    org.mybatis.spring: WARN # MyBatis Spring 日志级别

springdoc:
  api-docs:
    path: /v3/api-docs # OpenAPI 文档路径
  swagger-ui:
    path: /swagger-ui.html # Swagger UI 页面路径

app:
  config-crypto:
    master-key: ${APP_CONFIG_MASTER_KEY:} # 系统配置密钥主密钥，仅允许来自宿主环境，不进入系统配置表
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5002,http://localhost:5003} # CORS 允许的源列表
